name: Build libjpeg-turbo Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'libjpeg-turbo version (use "latest" for most recent release)'
        required: true
        default: 'latest'
      jpeg8:
        description: 'Build with libjpeg v8 API/ABI compatibility'
        required: false
        type: boolean
        default: false
      jpeg7:
        description: 'Build with libjpeg v7 API/ABI compatibility'
        required: false
        type: boolean
        default: false
      enable_simd:
        description: 'Enable SIMD optimizations'
        required: false
        type: boolean
        default: true
      enable_arith_enc:
        description: 'Enable arithmetic encoding'
        required: false
        type: boolean
        default: true
      enable_arith_dec:
        description: 'Enable arithmetic decoding'
        required: false
        type: boolean
        default: true
      enable_turbojpeg:
        description: 'Enable TurboJPEG API library'
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        choco install cmake -y
        choco install nasm -y

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Windows binaries
      shell: cmd
      run: |
        REM Build command with options
        set BUILD_CMD=build-windows.bat

        REM Add build options based on inputs
        if "${{ github.event.inputs.jpeg8 }}"=="true" (
          set BUILD_CMD=%BUILD_CMD% --jpeg8
        )

        if "${{ github.event.inputs.jpeg7 }}"=="true" (
          set BUILD_CMD=%BUILD_CMD% --jpeg7
        )

        if "${{ github.event.inputs.enable_simd }}"=="false" (
          set BUILD_CMD=%BUILD_CMD% --no-simd
        )

        if "${{ github.event.inputs.enable_arith_enc }}"=="false" (
          set BUILD_CMD=%BUILD_CMD% --no-arith-enc
        )

        if "${{ github.event.inputs.enable_arith_dec }}"=="false" (
          set BUILD_CMD=%BUILD_CMD% --no-arith-dec
        )

        if "${{ github.event.inputs.enable_turbojpeg }}"=="false" (
          set BUILD_CMD=%BUILD_CMD% --no-turbojpeg
        )

        REM Add version
        set BUILD_CMD=%BUILD_CMD% ${{ github.event.inputs.version || 'latest' }}

        echo Build command: %BUILD_CMD%
        call %BUILD_CMD%

    - name: Get version for release
      shell: powershell
      run: |
        $CMakeFile = "build/source/CMakeLists.txt"
        $Content = Get-Content $CMakeFile -Raw
        if ($Content -match "set\(VERSION\s+([0-9.]+)") {
          $Version = $Matches[1]
          echo "VERSION_CLEAN=$Version" >> $env:GITHUB_ENV
        } else {
          echo "VERSION_CLEAN=${{ github.event.inputs.version }}" >> $env:GITHUB_ENV
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libjpeg-turbo-windows
        path: |
          build/output/libjpeg-turbo-*-windows.zip
          build/output/libjpeg-turbo-*-windows/
          build/output/checksums.txt
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.VERSION_CLEAN }}-windows
        name: libjpeg-turbo ${{ env.VERSION_CLEAN }} - Windows
        body: |
          # libjpeg-turbo ${{ env.VERSION_CLEAN }} - Windows Binaries

          Pre-built libraries for Windows (x86, x64, arm64).

          ## 📦 What's Included

          - **x86** - 32-bit x86 binaries (DLLs, static libs, headers)
          - **x64** - 64-bit x86-64 binaries (DLLs, static libs, headers)
          - **arm64** - 64-bit ARM64 binaries (DLLs, static libs, headers)

          ## 🎯 Contents

          Each architecture directory contains:
          - `bin/` - DLL files and executables
          - `lib/` - Import libraries (.lib files)
          - `include/` - Header files

          ## ⚙️ Build Configuration

          - **JPEG8 Compatibility**: ${{ github.event.inputs.jpeg8 == 'true' && '✅ Enabled' || '❌ Disabled' }}
          - **JPEG7 Compatibility**: ${{ github.event.inputs.jpeg7 == 'true' && '✅ Enabled' || '❌ Disabled' }}
          - **SIMD Optimizations**: ${{ github.event.inputs.enable_simd == 'false' && '❌ Disabled' || '✅ Enabled' }}
          - **Arithmetic Encoding**: ${{ github.event.inputs.enable_arith_enc == 'false' && '❌ Disabled' || '✅ Enabled' }}
          - **Arithmetic Decoding**: ${{ github.event.inputs.enable_arith_dec == 'false' && '❌ Disabled' || '✅ Enabled' }}
          - **TurboJPEG API**: ${{ github.event.inputs.enable_turbojpeg == 'false' && '❌ Disabled' || '✅ Enabled' }}

          ## 📥 Installation

          1. Download `libjpeg-turbo-windows.zip`
          2. Extract to your desired location
          3. Select the appropriate architecture folder (x86, x64, or arm64)
          4. Copy DLLs from `bin/` to your application directory
          5. Link against the `.lib` files when building
          6. Include the headers in your project

          ## 🔐 Checksums

          See `checksums.txt` for SHA256 verification.

          ## 📖 Documentation

          - [libjpeg-turbo Official Docs](https://libjpeg-turbo.org/)
          - [Original Release Notes](https://github.com/libjpeg-turbo/libjpeg-turbo/releases/tag/${{ env.VERSION_CLEAN }})

          ---

          Built with ❤️ using GitHub Actions
        files: |
          build/output/libjpeg-turbo-*-windows.zip
          build/output/checksums.txt
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

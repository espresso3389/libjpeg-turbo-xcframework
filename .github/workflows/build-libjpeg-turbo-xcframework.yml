name: Build libjpeg-turbo XCFramework

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'libjpeg-turbo version (use "latest" for most recent release)'
        required: true
        default: 'latest'
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        brew install cmake nasm jq

    - name: Make build script executable
      run: chmod +x build.sh

    - name: Build XCFrameworks
      id: build
      run: |
        INPUT_VERSION="${{ github.event.inputs.version || 'latest' }}"
        ./build.sh "$INPUT_VERSION"

        # Export version for later steps
        source scripts/common.sh
        source scripts/fetch-source.sh
        if [ "$INPUT_VERSION" = "latest" ]; then
          LATEST_VERSION=$(curl -s https://api.github.com/repos/libjpeg-turbo/libjpeg-turbo/releases/latest | jq -r .tag_name)
          VERSION="$LATEST_VERSION"
        else
          VERSION="$INPUT_VERSION"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: libjpeg-turbo-xcframework
        path: |
          build/output/libjpeg.xcframework
          build/output/libturbojpeg.xcframework
          build/output/libjpeg-turbo-*-xcframework.zip
          build/output/Package.swift
          build/output/libjpeg-turbo.podspec
          build/output/checksums.txt
        retention-days: 30
    
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.build.outputs.version }}
        name: libjpeg-turbo ${{ steps.build.outputs.version }} XCFramework
        body: |
          # libjpeg-turbo ${{ steps.build.outputs.version }} - Universal XCFramework

          Pre-built universal XCFramework for iOS and macOS.

          ## 📦 What's Included

          - **libjpeg.xcframework** - Standard libjpeg library
          - **libturbojpeg.xcframework** - TurboJPEG API library

          ## 🎯 Supported Platforms

          - **iOS**: arm64 (device) + arm64/x86_64 (simulator)
          - **macOS**: arm64 (Apple Silicon) + x86_64 (Intel)

          ## 📥 Installation

          ### Swift Package Manager

          A ready-to-use `Package.swift` file is included in this release. To use it:

          1. Download `Package.swift` from this release
          2. Commit it to your repository root
          3. Tag with version `${{ steps.build.outputs.version }}`
          4. Push to GitHub

          Consumers can then add to their `Package.swift`:
          ```swift
          .package(url: "https://github.com/${{ github.repository }}", from: "${{ steps.build.outputs.version }}")
          ```

          ### Manual Installation
          1. Download `libjpeg-turbo-xcframework.zip`
          2. Extract and drag the `.xcframework` files into your Xcode project
          3. Ensure "Do Not Embed" is selected (static libraries)

          ## 🔐 Checksums

          See `checksums.txt` for SHA256 verification.

          ## 📖 Documentation

          - [libjpeg-turbo Official Docs](https://libjpeg-turbo.org/)
          - [Original Release Notes](https://github.com/libjpeg-turbo/libjpeg-turbo/releases/tag/${{ steps.build.outputs.version }})

          ---

          Built with ❤️ using GitHub Actions
          Triggered by: ${{ github.event_name }}
        files: |
          build/output/libjpeg-turbo-*-xcframework.zip
          build/output/checksums.txt
          build/output/Package.swift
          build/output/libjpeg-turbo.podspec
        draft: false
        prerelease: false
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
